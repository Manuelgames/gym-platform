<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Roman Colosseum</title><link rel="stylesheet" href="../styles/app.css"></head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <a class="auth-brand" href="../index.html"><img src="../assets/logosintexto.png" alt=""><span>Roman Colosseum</span></a>
      <h1 id="login-title">Regresa a la arena</h1>
      <p>Tu rutina, dieta y progreso te esperan donde los dejaste.</p>
      <form class="form" data-mode="login">
        <label class="field">Correo electrónico<input name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></label>
        <label class="field">Contraseña<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <p class="form-message" data-form-message hidden aria-live="polite"></p>
        <button class="button" type="submit">Entrar al imperio</button>
      </form>
      <p class="form-note">¿Aún no tienes cuenta? <a href="registro.html">Crea tu perfil de guerrero</a>.</p>
    </section>
  </main>
  <script src="../scrips/data.js"></script><script src="../scrips/auth.js"></script>
</body></html>
