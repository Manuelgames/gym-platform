<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi rutina | Roman Colosseum</title><link rel="stylesheet" href="../styles/app.css"></head>
<body data-protected="true">
  <header class="site-header"><a class="brand" href="menu.html"><img src="../assets/logosintexto.png" alt=""><span>Roman Colosseum</span></a><button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-label="Abrir menú">☰</button><nav class="site-nav" data-nav><a href="menu.html">Mi imperio</a><a class="is-current" href="rutina.html">Rutina</a><a href="dieta.html">Dieta</a><a href="calculadora.html">Calorías</a><a href="blog.html">Blog</a><button data-logout>Cerrar sesión</button></nav></header>
  <main class="page"><p class="eyebrow">Tu arsenal semanal</p><h1 class="display">La rutina del héroe</h1><p class="lead">Añade tus propios ejercicios. Cada día de la semana pertenece únicamente a tu perfil.</p>
    <section class="section workout-layout"><nav class="week-nav" aria-label="Días de la semana" data-week-nav></nav><section class="routine-panel"><div class="routine-panel-header"><div><p class="eyebrow" data-day-label>Lunes</p><h2 data-routine-title>Prepara tu batalla</h2></div><button class="button button--small" type="button" data-open-routine>+ Ejercicio</button></div><div class="routine-list" data-routine-list></div></section></section>
  </main>
  <dialog class="dialog" data-routine-dialog><form data-routine-form><h2>Añade un ejercicio</h2><p class="lead">Una nueva pieza para tu estrategia semanal.</p><div class="form"><div class="field-row"><label class="field">Día<select name="day" required></select></label><label class="field">Grupo muscular<select name="muscle" required><option value="Pecho">Pecho</option><option value="Espalda">Espalda</option><option value="Piernas">Piernas</option><option value="Hombros">Hombros</option><option value="Brazos">Brazos</option><option value="Core">Core</option><option value="Cardio">Cardio</option></select></label></div><label class="field">Ejercicio<input name="name" required maxlength="80" placeholder="Ej. Press con barra"></label><div class="field-row"><label class="field">Series<input name="sets" type="number" min="1" max="30" required placeholder="4"></label><label class="field">Repeticiones<input name="reps" type="text" required maxlength="20" placeholder="8–12"></label></div><label class="field">Notas <textarea name="notes" maxlength="240" placeholder="Técnica, descanso, peso objetivo…"></textarea></label></div><div class="dialog-actions"><button class="button button--subtle" type="button" data-close-routine>Cancelar</button><button class="button" type="submit">Guardar ejercicio</button></div></form></dialog>
  <script src="../scrips/data.js"></script><script src="../scrips/app.js"></script><script src="../scrips/rutina.js"></script>
</body></html>
