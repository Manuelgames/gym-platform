<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | Roman Colosseum</title><link rel="stylesheet" href="../styles/app.css"></head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="register-title">
      <a class="auth-brand" href="../index.html"><img src="../assets/logosintexto.png" alt=""><span>Roman Colosseum</span></a>
      <h1 id="register-title">Forja tu leyenda</h1>
      <p>Crea un espacio privado para construir hábitos dignos de un héroe.</p>
      <form class="form" data-mode="register">
        <label class="field">Nombre<input name="name" type="text" autocomplete="name" required minlength="2" placeholder="Nombre con el que entrenas"></label>
        <label class="field">Correo electrónico<input name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></label>
        <label class="field">Contraseña<input name="password" type="password" autocomplete="new-password" required minlength="4" placeholder="Mínimo 4 caracteres"></label>
        <div class="field-row"><label class="field">Nacimiento<input name="birthDate" type="date" required></label><label class="field">Identidad<select name="sex" required><option value="" selected disabled>Selecciona</option><option value="mujer">Mujer</option><option value="hombre">Hombre</option><option value="prefiero no decirlo">Prefiero no decirlo</option></select></label></div>
        <p class="form-message" data-form-message hidden aria-live="polite"></p>
        <button class="button" type="submit">Crear mi perfil</button>
      </form>
      <p class="form-note">¿Ya eres parte del imperio? <a href="ingresar.html">Inicia sesión</a>.</p>
    </section>
  </main>
  <script src="../scrips/data.js"></script><script src="../scrips/auth.js"></script>
</body></html>
